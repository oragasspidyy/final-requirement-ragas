name: petcarehub
description: "PetCareHub – A Mobile Pet Health and Service Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.20.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

  # Local reminders / notifications
  flutter_local_notifications: ^18.0.1
  timezone: ">=0.9.4 <0.11.0"

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Run `dart run flutter_launcher_icons` once to set the app icon.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
